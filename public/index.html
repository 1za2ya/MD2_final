<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Maze Trace XR</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/vendor/aframe/aframe-v1.7.1.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/game.js" defer></script>
</head>
<body>
  <main id="setup" class="panel">
    <p class="eyebrow">BEHAVIOR RESEARCH / WEBXR</p>
    <h1>Maze Trace <span>XR</span></h1>
    <p class="lead">迷路を探索し、すべての光片を集めてください。移動経路は匿名の客観データとして記録されます。</p>
    <div class="mode-switch" role="group" aria-label="ゲームモード">
      <button class="mode active" data-mode="solo">SOLO</button>
      <button class="mode" data-mode="multiplayer">MULTIPLAYER</button>
    </div>
    <label>匿名プレイヤーID<input id="player-id" maxlength="24" autocomplete="off"></label>
    <label id="room-field" hidden>ルームID<input id="room-id" maxlength="20" value="LAB-01" autocomplete="off"></label>
    <label>ステージ参加コード（空欄でBasic）<input id="stage-code" maxlength="32" autocomplete="off"></label>
    <button id="enter-button" class="primary">ENTER THE MAZE <span>→</span></button>
    <p id="setup-error" class="error" role="alert"></p>
    <div class="howto"><span>WASD</span> 移動　<span>MOUSE</span> 視点　<span>VR</span> 対応機器</div>
  </main>
  <section id="game" class="inactive">
    <div class="hud top-left"><div class="brand">MAZE TRACE <b>XR</b></div><div id="stage-name">BASIC</div><div id="status">準備中</div></div>
    <div id="coin-status-bar" class="hud top-right" aria-live="polite">
      <div><small>TIME</small><strong id="timer">00:00.0</strong></div>
      <div><small>COINS</small><strong><span id="coin-count">0</span>/<span id="coin-total">0</span></strong></div>
      <div><small>REMAINING</small><strong id="coin-remaining">0</strong></div>
      <div id="rank-box" hidden><small>RANK</small><strong id="rank">1</strong></div>
    </div>
    <div id="ranking" class="hud ranking" hidden></div>
    <div id="message" class="message">クリックしてマウス操作を有効にします</div>
    <a-scene id="scene" embedded renderer="colorManagement: true; physicallyCorrectLights: true" background="color: #182825" fog="type: exponential; color: #182825; density: 0.011" vr-mode-ui="enabled: true" loading-screen="dotsColor: #ffd34e; backgroundColor: #101b19">
      <!-- 暗い床との明度差を確保し、曲がり角や壁面を素早く識別できる高視認性の配色にする。 -->
      <a-assets><a-mixin id="wall" geometry="primitive: box; width: 2; height: 2.8; depth: 2" material="color: #71958d; emissive: #183d37; emissiveIntensity: .24; roughness: .72; metalness: .04; flatShading: true"></a-mixin></a-assets>
      <a-entity light="type: ambient; color: #d8fff5; intensity: 1.05"></a-entity>
      <a-entity light="type: hemisphere; color: #e7fff9; groundColor: #26413b; intensity: .85"></a-entity>
      <a-entity light="type: directional; color: #fff1bd; intensity: 1.45" position="-4 9 3"></a-entity>
      <a-plane id="floor" position="7 -0.05 7" rotation="-90 0 0" width="18" height="18" material="color: #111d1b; roughness: 1; metalness: 0; repeat: 9 9"></a-plane>
      <a-entity id="maze"></a-entity><a-entity id="coins"></a-entity><a-entity id="remote-players"></a-entity>
      <a-entity id="player-rig" position="1 0 1" maze-controller>
        <a-camera id="camera" position="0 1.65 0" look-controls="pointerLockEnabled: true" wasd-controls="enabled: false">
          <a-entity cursor="fuse: false; rayOrigin: mouse" raycaster="objects: .coin"></a-entity>
        </a-camera>
      </a-entity>
      <a-sky color="#182825"></a-sky>
    </a-scene>
    <div id="result" class="result" hidden>
      <p class="eyebrow">RUN COMPLETE</p><h2>探索完了</h2>
      <div class="result-grid"><div><small>TIME</small><strong id="result-time">—</strong></div><div><small>DISTANCE</small><strong id="result-distance">—</strong></div><div><small>TRIAL</small><strong id="result-trial">1</strong></div><div><small>COINS</small><strong id="result-coins">—</strong></div></div>
      <div id="round-results" class="round-results" hidden></div>
      <p id="next-status" class="next-status">次のゲームを準備しています</p>
      <div class="result-actions"><button id="next-button" class="primary">NEXT GAME</button><button id="exit-button" class="secondary">終了</button></div>
    </div>
  </section>
</body>
</html>
